<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Kümes çiti kesiti: fiberglass levha toprağın 20 cm altına iner, toprağın 50 cm üstüne çıkar; tel örgüye bağlanır.">
<defs>
<linearGradient id="gok" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4F1E1"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<linearGradient id="toprak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86654A"/><stop offset="1" stop-color="#5A432F"/></linearGradient>
<linearGradient id="levha" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#F1F4F0"/><stop offset="1" stop-color="#D9E0D7"/></linearGradient>
<pattern id="tel" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<path d="M0 0H18M0 0V18" stroke="#7D8A80" stroke-width="1.3" fill="none"/></pattern>
<pattern id="tas" width="40" height="30" patternUnits="userSpaceOnUse">
<circle cx="8" cy="9" r="2.2" fill="#4E3A28" opacity=".5"/><circle cx="28" cy="20" r="1.6" fill="#B49170" opacity=".5"/><circle cx="33" cy="6" r="1.2" fill="#4E3A28" opacity=".4"/></pattern>
</defs>
<rect width="640" height="420" fill="url(#gok)"/>
<!-- tel orgu ve direkler -->
<rect x="70" y="40" width="400" height="222" fill="url(#tel)"/>
<rect x="60" y="30" width="11" height="262" rx="3" fill="#1B5323"/>
<rect x="469" y="30" width="11" height="262" rx="3" fill="#1B5323"/>
<!-- toprak -->
<rect x="0" y="262" width="640" height="158" fill="url(#toprak)"/>
<rect x="0" y="262" width="640" height="158" fill="url(#tas)"/>
<!-- levha -->
<rect x="70" y="142" width="400" height="168" fill="url(#levha)" stroke="#B7C0B5"/>
<rect x="70" y="262" width="400" height="48" fill="#5A432F" opacity=".18"/>
<path d="M0 262 H640" stroke="#4C8F3E" stroke-width="8"/>
<!-- baglama noktalari -->
<g fill="none" stroke="#2E8D32" stroke-width="3" stroke-linecap="round">
<path d="M120 150 q6 -10 12 0"/><path d="M220 150 q6 -10 12 0"/><path d="M320 150 q6 -10 12 0"/><path d="M420 150 q6 -10 12 0"/>
</g>
<!-- olculer -->
<g stroke="#1C2620" stroke-width="2" fill="none">
<line x1="505" y1="142" x2="505" y2="258"/><line x1="496" y1="142" x2="514" y2="142"/><line x1="496" y1="258" x2="514" y2="258"/>
</g>
<g stroke="#FFFFFF" stroke-width="2" fill="none">
<line x1="505" y1="266" x2="505" y2="310"/><line x1="496" y1="310" x2="514" y2="310"/>
</g>
<g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="700">
<text x="524" y="204" font-size="24" fill="#1C2620">50 cm</text>
<text x="524" y="224" font-size="14" font-weight="600" fill="#6B756D">toprak üstü</text>
<text x="524" y="292" font-size="24" fill="#FFFFFF">20 cm</text>
<text x="524" y="311" font-size="14" font-weight="600" fill="#F1E6DA">toprak altı</text>
<text x="80" y="64" font-size="14" font-weight="700" fill="#1C2620" opacity=".7">tel örgü</text>
<text x="270" y="210" font-size="20" text-anchor="middle" fill="#1B5323">fiberglass levha</text>
</g>
<!-- kazma girisimi: levhanin alt kenarinda durur -->
<path d="M150 405 C175 380 200 350 222 324" stroke="#F1E6DA" stroke-width="3" fill="none" stroke-dasharray="4 7" stroke-linecap="round"/>
<circle cx="232" cy="314" r="14" fill="#8C2E55"/><path d="M226 308 l12 12 M238 308 l-12 12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<text x="254" y="344" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F7EEE4">Kazarak geçiş burada durur</text>
</svg>
